  <script>
    // Gera favicon e apple-touch-icon a partir da logo embutida
    window.addEventListener('load', function() {
      try {
        // Aguarda a logo estar disponível
        setTimeout(function() {
          if (typeof LOGO_RUFINO === 'undefined') return;
          var sizes = [32, 180, 192];
          sizes.forEach(function(sz) {
            var canvas = document.createElement('canvas');
            canvas.width = sz; canvas.height = sz;
            var ctx = canvas.getContext('2d');
            // Fundo branco arredondado
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            var r = sz * 0.15;
            ctx.moveTo(r, 0); ctx.lineTo(sz-r, 0);
            ctx.quadraticCurveTo(sz, 0, sz, r);
            ctx.lineTo(sz, sz-r);
            ctx.quadraticCurveTo(sz, sz, sz-r, sz);
            ctx.lineTo(r, sz);
            ctx.quadraticCurveTo(0, sz, 0, sz-r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();
            // Logo
            var img = new Image();
            img.onload = function() {
              var pad = sz * 0.08;
              ctx.drawImage(img, pad, pad, sz-pad*2, sz-pad*2);
              var url = canvas.toDataURL('image/png');
              if (sz === 32) {
                // Favicon
                var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                link.type = 'image/png'; link.rel = 'icon'; link.href = url;
                document.head.appendChild(link);
              }
              if (sz === 180) {
                // Apple touch icon
                var alink = document.querySelector("link[rel='apple-touch-icon']") || document.createElement('link');
                alink.rel = 'apple-touch-icon'; alink.href = url;
                document.head.appendChild(alink);
              }
            };
            img.src = LOGO_RUFINO;
          });
        }, 500);
      } catch(e) { console.log('favicon err', e); }
    });
  </script>

function gerarSemanas(ano,mes){
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const br=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
  const ultimo=new Date(ano,mes,0);
  const semanas=[];
  let inicio=new Date(ano,mes-1,1),num=1;
  while(inicio<=ultimo){
    let fim=new Date(inicio);
    while(fim.getDay()!==0&&fim<ultimo) fim.setDate(fim.getDate()+1);
    if(fim>ultimo) fim=new Date(ultimo);
    semanas.push({id:`${ano}-${pad(mes)}-s${num}`,label:`Semana ${num}`,inicio:fmt(inicio),fim:fmt(fim),inicioBr:br(inicio),fimBr:br(fim)});
    inicio=new Date(fim); inicio.setDate(inicio.getDate()+1); num++;
  }
  if(ano===2026&&mes===6) semanas[0]={id:"2026-06-s1",label:"Semana 1",inicio:"2026-05-29",fim:"2026-06-07",inicioBr:"29/05",fimBr:"07/06",especial:true};
  return semanas;
}
function getMesInfo(ano,mes){return{id:`${ano}-${String(mes).padStart(2,'0')}`,label:`${NOMES_MES[mes-1]} ${ano}`,ano,mes,semanas:gerarSemanas(ano,mes)};}
function navMesDir(ano,mes,d){let m=mes+d,a=ano;if(m>12){m=1;a++;}if(m<1){m=12;a--;}return{ano:a,mes:m};}

const brl=v=>"R$ "+Number(v).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const fmtData=s=>s?s.slice(5).replace("-","/"):"";
function vSemana(vendas,s){return vendas.filter(v=>v.data>=s.inicio&&v.data<=s.fim);}
function vMes(vendas,mi){const ini=mi.semanas[0].inicio,fim=mi.semanas[mi.semanas.length-1].fim;return vendas.filter(v=>v.data>=ini&&v.data<=fim);}
function calcNivel(t){if(t>=META_OURO)return{nivel:"OURO",emoji:"🥇",cor:"#B8860B",bg:"#FFF8E1",bonus:200};if(t>=META_PRATA)return{nivel:"PRATA",emoji:"🥈",cor:"#607D8B",bg:"#ECEFF1",bonus:150};if(t>=META_BRONZE)return{nivel:"BRONZE",emoji:"🥉",cor:"#CD7F32",bg:"#FBE9E7",bonus:100};return null;}
function calcCom(t){return t<META_COMISSAO?0:t*0.03;}
function fmtValorExcel(v){return brl(v);}

async function sbCarregar(){
  const {data,error}=await sb.from('vendas').select('*').order('data',{ascending:true});
  if(error){console.error(error);return null;}
  return data.map(r=>({id:r.id,data:r.data,cliente:r.cliente,servico:r.servico,valor:Number(r.valor),responsavel:r.responsavel,pagamento:r.pagamento||"",obs:r.obs||"",arquivo:r.arquivo_url?{url:r.arquivo_url,nome:r.arquivo_nome}:null}));
}

  await sb.from('vendas').insert(rows);
}
async function sbSalvar(item){
  const row={id:item.id,data:item.data,cliente:item.cliente,servico:item.servico,valor:item.valor,responsavel:item.responsavel,pagamento:item.pagamento,obs:item.obs,arquivo_url:item.arquivo?item.arquivo.url:null,arquivo_nome:item.arquivo?item.arquivo.nome:null};
  const {error}=await sb.from('vendas').upsert(row);
  if(error)console.error(error);
}
async function sbExcluir(id){await sb.from('vendas').delete().eq('id',id);}
async function sbUpload(file){
  const nome=`${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  const {error}=await sb.storage.from('Anexos').upload(nome,file);
  if(error){console.error(error);return null;}
  const {data}=sb.storage.from('Anexos').getPublicUrl(nome);

        e("div",{style:{background:"#fff",borderRadius:12,padding:18,border:"1.5px solid #E0E0E0"}},
          e("div",{style:{fontWeight:700,color:"#1B3A5C",fontSize:13,marginBottom:10,borderBottom:"2px solid #E8F5E9",paddingBottom:8}},"📊 Exemplos de Ganho Mensal"),
          e("table",{style:{width:"100%",borderCollapse:"collapse"}},
            e("thead",null,e("tr",{style:{background:VERDE}},
              ["Vendas no Mês","Comissão 3%","Bônus Ranking","Total"].map(h=>e("th",{key:h,style:{padding:"8px 10px",color:"#fff",fontSize:11,textAlign:"center",fontWeight:700}},h)))),
            e("tbody",null,
              [{v:11000,bg:"#FFEBEE"},{v:14000,bg:"#fff"},{v:17000,bg:"#FBE9E7"},{v:22000,bg:"#ECEFF1"},{v:26000,bg:"#FFF8E1"}].map((r,i)=>{
                const com=calcCom(r.v),nivel=calcNivel(r.v),total=com+(nivel?nivel.bonus:0);
                return e("tr",{key:i,style:{background:r.bg}},
                  e("td",{style:{padding:"8px 10px",fontWeight:700,fontSize:12,textAlign:"center"}},brl(r.v)),
                  e("td",{style:{padding:"8px 10px",fontSize:12,textAlign:"center",color:com>0?VERDE:COR.vermelho,fontWeight:700}},com>0?brl(com):"R$ 0,00"),
                  e("td",{style:{padding:"8px 10px",fontSize:12,textAlign:"center"}},nivel?e("span",{style:{fontWeight:700,color:nivel.cor}},`${nivel.emoji} +${brl(nivel.bonus)}`):"—"),
                  e("td",{style:{padding:"8px 10px",fontWeight:800,fontSize:13,textAlign:"center",color:total>0?VERDE:COR.vermelho}},total>0?brl(total):"R$ 0,00"));}))))))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));


</script>
